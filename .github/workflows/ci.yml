name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (app)
        run: npm run type-check

      - name: Type-check (tests)
        run: npx tsc -p tsconfig.test.json --noEmit

      # Non-blocking for now — tighten once the warning backlog is cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npx vitest run

      # The build is a gate: type-check and tests passed while `next build` failed (Etap 4b-cache —
      # a Node-only import pulled into a client page). next.config ignores type/lint errors during the
      # build (the steps above cover those), so this catches what only the bundler sees.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          # Compiler caches only — never the data cache (fetch-cache), so a CI build can't reuse data.
          path: |
            .next/cache
            !.next/cache/fetch-cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.js', 'tailwind.config.*', 'postcss.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
